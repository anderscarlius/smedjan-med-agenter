# User Stories: PO-001

Följande stories skapades från spec PO-001:

- PO-001.1: Hämta vitals från Philips-system
- PO-001.2: Beräkna EWS-score enligt NEWS2
- PO-001.3: Exponera API för att hämta senaste EWS
- PO-001.4: Lagra EWS i Datahubb
- PO-001.5: Autentisering OAuth2 mot Philips

## Beroenden

