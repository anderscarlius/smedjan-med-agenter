# User Stories: AX-001

Följande stories skapades från spec AX-001:

- AX-001.1: Hämta vitals från Philips-system
- AX-001.2: Beräkna EWS-score enligt NEWS2
- AX-001.3: Exponera API för att hämta senaste EWS
- AX-001.4: Lagra EWS i Datahubb
- AX-001.5: Autentisering OAuth2 mot Philips

## Beroenden

